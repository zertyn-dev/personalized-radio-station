# Backend runtime config.
#
# UI-created vibes define station name, RSS sources, host tone, host format,
# and episode length. Keep this file for provider/model settings and server
# fallbacks that are not station identity.

news:
  language: "en-US"
  country: "US"

weather:
  # Fallback location until the UI sends a listener/station weather location.
  name: "Lisbon"
  latitude: 38.7223
  longitude: -9.1393

ai:
  model: "openrouter/openai/gpt-oss-20b:nitro"
  api_key_env: "OPENROUTER_API_KEY"
  temperature: 0.7
  max_tokens: 4000
  reasoning:
    effort: "low"
    exclude: true

tts:
  enabled: true
  provider: "elevenlabs"
  # eleven_multilingual_v2 is the best quality/cost balance for natural radio.
  # eleven_turbo_v2_5 is faster + cheaper but flatter. eleven_v3 is more
  # expressive (alpha-gated). UI host_profile may override the per-voice id.
  model: "elevenlabs/eleven_multilingual_v2"
  response_format: "mp3"
  api_key_env: "ELEVENLABS_API_KEY"
  single_voice: true
  primary_voice: "host"
  words_per_minute: 155
  voices:
    host:
      # Rachel — warm, narrative female from the standard ElevenLabs library.
      # Overridden by host_profile when the UI sets voice_gender + host_format.
      voice: "21m00Tcm4TlvDq8ikWAM"
      words_per_minute: 155
      settings:
        stability: 0.35
        similarity_boost: 0.85
        style: 0.45
        use_speaker_boost: true
