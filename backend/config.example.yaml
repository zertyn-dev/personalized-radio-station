# Backend runtime config.
#
# UI-created vibes define station name, RSS sources, host tone, host format,
# and episode length. Keep this file for provider/model settings and server
# fallbacks that are not station identity.

news:
  language: "en-US"
  country: "US"

weather:
  # Fallback location until the UI sends a listener/station weather location.
  name: "Lisbon"
  latitude: 38.7223
  longitude: -9.1393

ai:
  model: "openrouter/openai/gpt-oss-safeguard-20b:nitro"
  api_key_env: "OPENROUTER_API_KEY"
  temperature: 0.7
  max_tokens: 4000
  reasoning:
    effort: "low"
    exclude: true

tts:
  enabled: true
  provider: "elevenlabs"
  # eleven_multilingual_v2 is the safe, quality-leaning default. If the
  # account has access, eleven_v3 (alpha) is markedly more expressive and
  # supports inline emotion tags; switch by replacing the model below.
  model: "elevenlabs/eleven_multilingual_v2"
  response_format: "mp3"
  api_key_env: "ELEVENLABS_API_KEY"
  single_voice: true
  primary_voice: "host"
  # Slightly slower than typical broadcast WPM so pauses (the ... and —
  # the prompt produces) actually breathe.
  words_per_minute: 150
  voices:
    host:
      # Aria — expressive, conversational female from the standard library.
      # Overridden by host_profile when the UI sets voice_gender + host_format.
      voice: "9BWtsMINqrJLrRacOk9x"
      words_per_minute: 150
      settings:
        stability: 0.30
        similarity_boost: 0.75
        style: 0.55
        use_speaker_boost: false
